# ==========================================
# AI ResearchHub Configuration
# ==========================================

server.port=8080

# Database Engine: 'sqlite' (embedded zero-setup default) or 'mysql'
db.type=sqlite
db.sqlite.url=jdbc:sqlite:data/ai_researchhub.db

# Optional MySQL Configuration (when db.type=mysql)
db.mysql.url=jdbc:mysql://localhost:3306/ai_researchhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.user=root
db.mysql.password=

# JWT and Security Secret
jwt.secret=ai_researchhub_super_secret_jwt_key_2026_xyz

# Upload Directory
upload.dir=uploads

# ==========================================
# AI Assistant LLM Provider Configuration
# ==========================================
# ai.provider options:
#  'free'    -> Pollinations.ai (100% Free, NO API Key needed, multi-turn LLM)
#  'gemini'  -> Google Gemini 1.5 Flash (free tier at aistudio.google.com)
#  'groq'    -> Groq ultra-fast Llama-3.1 (free tier at console.groq.com)
#  'openai'  -> OpenAI GPT models
#  'offline' -> Built-in offline ML reasoning engine
ai.provider=free
ai.model=openai
ai.api.key=
